name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: site/index.html must be built from src/page.html
        run: npm run build && git diff --exit-code site/index.html
      - run: npx playwright install --with-deps chromium
      - name: Smoke test every page and project
        run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish site/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: nfh2025.rdgnbl.com
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Deploy ${{ github.sha }}

  https:
    # Reports the Pages domain and certificate. The workflow token can read these settings
    # but not change them; changes are made in repo Settings > Pages (see README).
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Custom domain, certificate and HTTPS
        run: |
          info() { gh api "repos/$REPO/pages" --jq "$1" 2>&1; }
          echo "::notice title=Pages::$(info '{source: .source.branch, cname, https_enforced, cert: .https_certificate.state}')"
          state=$(info '.https_certificate.state // "none"')
          if [ "$state" = "none" ]; then
            echo "::warning title=HTTPS::No certificate requested. In Settings > Pages, remove the custom domain, save, add nfh2025.rdgnbl.com back, save."
          elif [ "$state" = "approved" ] && [ "$(info .https_enforced)" != "true" ]; then
            echo "::warning title=HTTPS::Certificate is ready. Tick Enforce HTTPS in Settings > Pages."
          else
            echo "::notice title=HTTPS::certificate $state, enforced $(info .https_enforced)"
          fi

  live:
    # Reports on the live site after each deploy. Never blocks a deploy; read the results as
    # annotations on the run summary.
    needs: [deploy, https]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: DNS and HTTPS
        run: |
          D=nfh2025.rdgnbl.com
          note() { v="${2:-(none)}"; echo "::notice title=$1::$v"; echo "$1: $v"; }
          note "DNS CNAME" "$(dig +short $D CNAME | tr '\n' ' ')"
          note "DNS A" "$(dig +short $D A | tr '\n' ' ')"
          note "rdgnbl.com nameservers" "$(dig +short rdgnbl.com NS | tr '\n' ' ')"
          note "HTTP" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$D/)"
          note "HTTPS" "$(curl -s -o /dev/null -w '%{http_code} %{ssl_verify_result}' https://$D/ 2>&1 || echo failed)"
          note "HTTPS certificate" "$(echo | openssl s_client -servername $D -connect $D:443 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null | tr '\n' ' ')"
          note "Served page" "$(curl -sL https://$D/ | grep -o '<title>[^<]*' | head -1)"
          note "github.io copy" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://matthewsmaglik.github.io/nonfictionhotlist/)"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: |
          sleep 60
          URL=https://nfh2025.rdgnbl.com
          curl -sf -o /dev/null $URL/ || { URL=http://nfh2025.rdgnbl.com; echo "::warning title=Live check::HTTPS not ready yet, testing $URL"; }
          npm run check -- $URL 2>&1 | tee live.txt || true
          while IFS= read -r line; do echo "::warning title=Live check::$line"; done < <(grep -E '^ - |all clear' live.txt)
