name: Publish

# Publishes the site. Runs on every push to main, every 15 minutes (to pick up edits made in
# the Google Drive kit), and on demand from the Actions tab (Run workflow).
# A scheduled run with no Drive changes stops after the pull step and publishes nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Pull text from the Google Drive kit
        id: pull
        run: node scripts/content/pull-drive.js

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.pull.outputs.changed }}" != "true" ] && [ "${{ steps.pull.outputs.problems_changed }}" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "No changes in Drive."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the site from content
        if: steps.decide.outputs.publish == 'true'
        run: npm run content && npm run build

      - name: Commit text changes from Drive
        if: steps.pull.outputs.changed == 'true' || steps.pull.outputs.problems_changed == 'true'
        env:
          SUMMARY: ${{ steps.pull.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/content.json content/sync-problems.txt src/page.html site/index.html
          git commit -m "Update from Google Drive: ${SUMMARY}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Build the PDF and smoke test
        if: steps.decide.outputs.publish == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run pdf
          npm run check

      - name: Publish site/ to the gh-pages branch
        if: steps.decide.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: nfh2025.rdgnbl.com
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: Publish ${{ github.sha }}

      # Fails the run (which emails the repo owner) only when a new problem shows up, so a
      # problem that sits in Drive doesn't send an alert every 15 minutes.
      - name: Flag Drive edits that were skipped
        if: always() && steps.pull.outputs.problems != '0' && steps.pull.outputs.problems != ''
        run: |
          { echo "### Drive edits that were skipped"; echo; echo "The site kept the previous text for these. Fix them in Drive and they publish on the next run."; echo; sed 's/^/- /' content/sync-problems.txt; } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::warning title=Skipped Drive edit::$line"; done < content/sync-problems.txt
          if [ "${{ steps.pull.outputs.problems_changed }}" = "true" ]; then exit 1; fi

  https:
    # Reports the Pages domain and certificate. The workflow token can read these settings
    # but not change them; changes are made in repo Settings > Pages (see README).
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Custom domain, certificate and HTTPS
        run: |
          info() { gh api "repos/$REPO/pages" --jq "$1" 2>&1; }
          echo "::notice title=Pages::$(info '{source: .source.branch, cname, https_enforced, cert: .https_certificate.state}')"
          state=$(info '.https_certificate.state // "none"')
          if [ "$state" = "none" ]; then
            echo "::warning title=HTTPS::No certificate requested. In Settings > Pages, remove the custom domain, save, add nfh2025.rdgnbl.com back, save."
          elif [ "$state" = "approved" ] && [ "$(info .https_enforced)" != "true" ]; then
            echo "::warning title=HTTPS::Certificate is ready. Tick Enforce HTTPS in Settings > Pages."
          else
            echo "::notice title=HTTPS::certificate $state, enforced $(info .https_enforced)"
          fi

  live:
    # Reports on the live site after each deploy. Never blocks a deploy; read the results as
    # annotations on the run summary.
    needs: [publish, https]
    if: always() && needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: DNS and HTTPS
        run: |
          D=nfh2025.rdgnbl.com
          note() { v="${2:-(none)}"; echo "::notice title=$1::$v"; echo "$1: $v"; }
          note "DNS CNAME" "$(dig +short $D CNAME | tr '\n' ' ')"
          note "DNS A" "$(dig +short $D A | tr '\n' ' ')"
          note "rdgnbl.com nameservers" "$(dig +short rdgnbl.com NS | tr '\n' ' ')"
          note "HTTP" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' http://$D/)"
          note "HTTPS" "$(curl -s -o /dev/null -w '%{http_code} %{ssl_verify_result}' https://$D/ 2>&1 || echo failed)"
          note "HTTPS certificate" "$(echo | openssl s_client -servername $D -connect $D:443 2>/dev/null | openssl x509 -noout -subject -issuer 2>/dev/null | tr '\n' ' ')"
          note "Served page" "$(curl -sL https://$D/ | grep -o '<title>[^<]*' | head -1)"
          note "github.io copy" "$(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' https://matthewsmaglik.github.io/nonfictionhotlist/)"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Smoke test the live site
        run: |
          sleep 60
          URL=https://nfh2025.rdgnbl.com
          curl -sf -o /dev/null $URL/ || { URL=http://nfh2025.rdgnbl.com; echo "::warning title=Live check::HTTPS not ready yet, testing $URL"; }
          npm run check -- $URL 2>&1 | tee live.txt || true
          while IFS= read -r line; do echo "::warning title=Live check::$line"; done < <(grep -E '^ - |all clear' live.txt)
