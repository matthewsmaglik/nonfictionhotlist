<style>
/* Layout: a deck you browse like a site. Cover, welcome, paged grids of four, one project page per film with tabs. Single brand look (forest green), not theme-switched. */
:root {
  --forest: #2e4a3b;
  --forest-deep: #22382c;
  --sage: #9aab8c;
  --sage-soft: #c6d0bb;
  --cream: #ebe6d7;
  --ink: #1d2b23;
  --line: rgba(235, 230, 215, 0.18);
  --muted: rgba(235, 230, 215, 0.68);
  --marker: rgba(154, 171, 140, 0.62);
  --tile: #18271e;

  --display: "League Spartan", "Futura", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --body: "Literata", "Iowan Old Style", Georgia, "Times New Roman", serif;

  --s-xs: 0.78rem;
  --s-sm: 0.9rem;
  --s-md: 1.05rem;
  --s-lg: clamp(1.4rem, 1.1rem + 1.2vw, 1.9rem);
  --s-xl: clamp(2.2rem, 1.4rem + 3.6vw, 4.2rem);
  --s-xxl: clamp(2.8rem, 1.6rem + 6vw, 6.4rem);

  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--forest); }
body {
  background: var(--forest);
  color: var(--cream);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--forest-deep);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--sage-soft); outline-offset: 3px; border-radius: 2px; }

.gutter {
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--forest-deep);
  border-bottom: 1px solid var(--line);
}
.bar-inner {
  display: flex; align-items: center; gap: 16px; justify-content: space-between;
  padding-block: 12px; max-width: 1180px; margin: 0 auto;
}
.wordmark {
  font-family: var(--display); font-weight: 700; font-size: 1.15rem;
  letter-spacing: -0.01em; text-decoration: none; white-space: nowrap;
}
.wordmark span { font-weight: 400; color: var(--muted); margin-left: 6px; }
.bar-nav { display: flex; align-items: center; gap: 6px; }
.btn {
  font-family: var(--display); font-weight: 600; font-size: var(--s-sm);
  background: transparent; color: var(--cream); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px 14px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; line-height: 1.2;
}
.btn:hover { border-color: var(--sage); }
.btn.solid { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.btn.solid:hover { background: var(--sage-soft); border-color: var(--sage-soft); }
.icon-btn { width: 34px; height: 34px; padding: 0; justify-content: center; font-size: 1rem; }
.icon-btn[aria-disabled="true"] { opacity: 0.3; pointer-events: none; }
.counter {
  font-family: var(--display); font-size: var(--s-xs); color: var(--muted);
  letter-spacing: 0.08em; text-transform: uppercase; min-width: 4.5em; text-align: center;
  font-variant-numeric: tabular-nums;
}

.toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--cream); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: var(--s-sm);
  padding: 10px 16px; border-radius: 999px; box-shadow: 0 8px 24px rgba(10, 20, 14, 0.35); max-width: calc(100% - 32px);
}
@media (max-width: 560px) { #pdfBtn { padding: 6px 10px; } .bar-nav { gap: 4px; } #prevBtn, #nextBtn { display: none; } }

/* Index drawer */
.index-panel {
  position: fixed; inset: 0; z-index: 20; background: rgba(20, 32, 25, 0.6);
  display: flex; justify-content: flex-end;
}
.index-sheet {
  width: min(420px, 100%); height: 100%; overflow-y: auto; background: var(--forest-deep);
  padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
  padding-left: 28px; padding-right: max(28px, env(safe-area-inset-right, 0px));
  border-left: 1px solid var(--line);
}
.index-sheet h2 { font-family: var(--display); font-size: var(--s-xl); margin: 0 0 12px; line-height: 1; }
.index-sheet ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.index-sheet a {
  display: flex; gap: 12px; text-decoration: none; padding: 6px 0; font-family: var(--display);
  font-weight: 600; font-size: 1.02rem; border-bottom: 1px solid var(--line);
}
.index-sheet a:hover { color: var(--sage-soft); }
.index-sheet .n { color: var(--muted); font-weight: 400; width: 2ch; font-variant-numeric: tabular-nums; }
.index-head { display: flex; justify-content: space-between; align-items: flex-start; }

main { padding-block: 0 64px; }

/* Cover */
.cover { display: grid; gap: 0; padding-block: 48px 40px; }
/* Lockup: the wordmark's two lines span exactly the numeral height.
   League Spartan digits rise 0.672em; the wordmark's ascenders rise 0.719em, plus one 0.9 line.
   So wordmark size = year size x 0.672 / (0.719 + 0.9) = year x 0.415, and last baselines align. */
.cover-head {
  --yr: clamp(4rem, 0.2rem + 20.5vw, 19rem);
  display: flex; align-items: last baseline; gap: calc(var(--yr) * 0.12); padding-top: 24px;
}
.cover-year {
  font-family: var(--display); font-weight: 800; color: var(--sage);
  font-size: var(--yr); line-height: 0.8; letter-spacing: -0.055em;
  margin-left: -0.05em; font-variant-numeric: lining-nums;
}
.cover h1 {
  font-family: var(--display); font-weight: 700; font-size: calc(var(--yr) * 0.415);
  line-height: 0.9; letter-spacing: -0.025em; margin: 0; white-space: nowrap;
}
.cover-foot {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px 48px; align-items: end;
  border-top: 1px solid var(--line); padding-top: 28px; margin-top: 40px;
}
.cover p.lede { max-width: 30em; font-size: var(--s-lg); line-height: 1.35; margin: 0; color: var(--cream); text-wrap: pretty; }
.cover-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.cover-actions .btn { font-size: 1.08rem; padding: 15px 28px; }
.cover-strip { margin-top: 40px; }
.cover-strip {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  border-top: 1px solid var(--line); padding-top: 18px; gap: 6px 24px;
}
.cover-strip a {
  font-family: var(--display); font-size: var(--s-sm); text-decoration: none; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cover-strip a:hover { color: var(--cream); }

/* Welcome */
/* Welcome, part 1: mosaic + lede + invitation */
.mosaic { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 28px; }
.mosaic a { aspect-ratio: 3 / 2; overflow: hidden; border-radius: 2px; display: block; background: var(--tile); }
/* Tiles sit as dark green rectangles. On its beat, each one slides away
   and the image behind it settles from a slow push-in. */
.mosaic a { position: relative; }
.mosaic a::after {
  content: ""; position: absolute; inset: 0; background: var(--tile);
  transform-origin: right center; pointer-events: none;
}
.mosaic a.v::after { transform-origin: center top; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; filter: saturate(0.85); }
.mosaic a.in img { opacity: 1; animation: tile-settle 1.6s cubic-bezier(0.16, 1, 0.3, 1); }
.mosaic a.in::after { transform: scaleX(0); animation: tile-wipe 0.9s cubic-bezier(0.76, 0, 0.24, 1); }
.mosaic a.in.v::after { transform: scaleY(0); animation-name: tile-wipe-v; }
@keyframes tile-wipe { from { transform: scaleX(1); } to { transform: scaleX(0); } }
@keyframes tile-wipe-v { from { transform: scaleY(1); } to { transform: scaleY(0); } }
@keyframes tile-settle { from { transform: scale(1.28); } to { transform: scale(1); } }
.mosaic a:hover img { filter: none; transform: scale(1.04); transition: filter 0.3s ease, transform 0.4s ease; }
@media (prefers-reduced-motion: reduce) {
  .mosaic img { opacity: 1; animation: none !important; }
  .mosaic a::after { display: none; }
}
.hi { color: var(--cream); background: linear-gradient(transparent 52%, var(--marker) 52%, var(--marker) 94%, transparent 94%); padding: 0 0.08em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.w-intro { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; padding-block: 48px 8px; align-items: start; }
.w-intro h2 { font-family: var(--display); font-size: var(--s-xl); line-height: 0.92; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.w-lede p { font-size: var(--s-lg); line-height: 1.38; margin: 0 0 0.6em; text-wrap: pretty; }
.w-lede p:last-child { color: var(--sage-soft); }
.w-lede .num { font-family: var(--display); font-weight: 700; color: var(--cream); }
.panel-dark { background: var(--forest-deep); border-radius: 6px; padding: 32px 36px; }
.w-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; margin-top: 40px; }
.w-label { font-family: var(--display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.14em; color: var(--sage-soft); padding-top: 4px; }
.w-row p { margin: 0 0 0.8em; max-width: 36em; }
.w-row p:last-child { margin: 0; }
.w-next { display: flex; justify-content: flex-end; gap: 10px; margin-top: 32px; flex-wrap: wrap; }
.w-next .btn { font-size: 1.15rem; padding: 17px 32px; }

/* Welcome, part 2: why + criteria + how to use */
.why-top { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; padding-block: 48px 32px; }
.why-top h2 { font-family: var(--display); font-size: var(--s-xl); line-height: 0.92; letter-spacing: -0.02em; margin: 0; }
.why-top p { margin: 0 0 0.9em; max-width: 36em; }
.why-top p:first-child { font-size: 1.2rem; line-height: 1.45; }
.select { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; background: var(--forest-deep); border-radius: 6px; padding: 32px 36px; }
.select .big { font-family: var(--display); font-weight: 800; font-size: clamp(5rem, 3rem + 8vw, 9rem); line-height: 0.8; letter-spacing: -0.04em; }
.select .big small { display: block; font-size: var(--s-xs); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sage-soft); margin-top: 14px; line-height: 1.4; }
.criteria { list-style: none; margin: 0 0 18px; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.criteria li { font-family: var(--display); font-weight: 600; font-size: 1.1rem; border: 1px solid var(--line); border-radius: 3px; padding: 12px 14px; }
.select p { margin: 0; color: var(--muted); }
.steps { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
.steps li { padding: 20px 20px 4px 0; display: grid; gap: 6px; align-content: start; }
.steps li + li { padding-left: 20px; border-left: 1px solid var(--line); }
.steps .k { font-family: var(--display); font-weight: 700; font-size: 2.2rem; line-height: 1; color: var(--sage); font-variant-numeric: tabular-nums; }
.steps b { font-family: var(--display); font-size: 1.15rem; }
.steps span { font-size: var(--s-sm); color: var(--muted); }
.close-line {
  font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 1.1rem + 1.5vw, 2.3rem); line-height: 1.15; letter-spacing: -0.01em;
  max-width: 24em; margin: 48px 0 0; padding-top: 26px; border-top: 1px solid var(--line); text-wrap: balance;
}

.prose p { margin: 0 0 1em; }
.prose h3 {
  font-family: var(--display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--sage-soft); margin: 2em 0 0.6em;
}
.prose ol { padding-left: 1.2em; margin: 0 0 1em; }
.prose li { margin-bottom: 0.3em; }
.prose .close { font-style: italic; }

/* Grid pages */
.page-head {
  display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap;
  padding-block: 44px 24px;
}
.page-head h2 { font-family: var(--display); font-size: var(--s-xl); line-height: 0.95; margin: 0; }
.page-head .range { font-family: var(--display); color: var(--muted); font-size: var(--s-sm); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 6px; }
.dots a {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--display); font-size: var(--s-xs); text-decoration: none; border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.dots a[aria-current="page"] { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px 24px; }
.card { text-decoration: none; display: grid; gap: 12px; align-content: start; min-width: 0; }
.card .meta {
  font-family: var(--display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--sage-soft);
}
.card h3 { font-family: var(--display); font-size: 1.3rem; line-height: 1.05; margin: 0; text-wrap: balance; }
.card p { margin: 0; font-size: var(--s-sm); color: var(--muted); line-height: 1.5; }
.card:hover .poster { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(10, 20, 14, 0.35); }
.card:hover h3 { color: var(--sage-soft); }

/* Poster (image or typographic fallback) */
.poster {
  aspect-ratio: 3 / 2; max-width: 100%; width: 100%; border-radius: 3px; overflow: hidden; position: relative;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex; flex-direction: column; justify-content: space-between; padding: 14px;
}
.poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.poster.t0 { background: var(--forest-deep); color: var(--cream); border: 1px solid var(--line); }
.poster.t1 { background: var(--sage); color: var(--ink); }
.poster.t2 { background: var(--cream); color: var(--forest); }
.poster .p-title {
  font-family: var(--display); font-weight: 800; font-size: clamp(1.15rem, 0.8rem + 1vw, 1.6rem);
  line-height: 0.9; letter-spacing: -0.02em; text-transform: lowercase; text-wrap: balance;
}
.poster .p-foot { display: flex; justify-content: space-between; font-family: var(--display); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.7; }
.poster.big .p-title { font-size: clamp(2rem, 1.2rem + 3vw, 3.6rem); }
.poster.big { padding: 24px; aspect-ratio: 21 / 9; border-radius: 0; }
.poster.big.has-img { padding: 0; }
.hero { margin: 20px 0 0; }
.hero .poster { border-radius: 3px; }
.stills { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stills.one { grid-template-columns: minmax(0, 1fr); }
.stills button { padding: 0; border: 0; background: var(--forest-deep); cursor: zoom-in; border-radius: 3px; overflow: hidden; display: block; }
.stills img { display: block; width: 100%; height: 100%; object-fit: cover; aspect-ratio: 3 / 2; transition: transform 0.4s ease; }
.stills button:hover img { transform: scale(1.03); }
.stills.three button:first-child { grid-column: 1 / -1; }
.stills.three button:first-child img { aspect-ratio: 16 / 9; }
.lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(12, 20, 15, 0.94); display: grid; place-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; }
.lightbox .btn { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); }

.pager {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 20px;
  border-top: 1px solid var(--line); flex-wrap: wrap;
}

/* Project page */
.crumb { padding-block: 28px 0; font-family: var(--display); font-size: var(--s-sm); }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--cream); }
.project { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 280px); gap: 48px; padding-block: 24px; }
.project aside { display: grid; gap: 16px; align-content: start; position: sticky; top: 84px; align-self: start; }
.facts { display: grid; gap: 10px; font-size: var(--s-sm); }
.facts div { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.facts dt { font-family: var(--display); text-transform: uppercase; letter-spacing: 0.1em; font-size: var(--s-xs); color: var(--sage-soft); padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copy-row code { font-family: var(--body); user-select: all; overflow-wrap: anywhere; }
.copy-btn { font-size: var(--s-xs); padding: 3px 10px; }

.project h1 {
  font-family: var(--display); font-weight: 700; font-size: var(--s-xl); line-height: 0.92;
  letter-spacing: -0.02em; margin: 0 0 18px; text-transform: lowercase; text-wrap: balance;
}
.logline { font-size: var(--s-lg); line-height: 1.35; margin: 0 0 28px; max-width: 30em; font-style: italic; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 28px; overflow-x: auto; }
.tabs a {
  font-family: var(--display); font-weight: 600; font-size: var(--s-sm); text-decoration: none;
  padding: 10px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.tabs a[aria-current="true"] { color: var(--cream); border-bottom-color: var(--cream); }
.tabs a:hover { color: var(--cream); }
.panel { max-width: 40em; }
.team { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px 24px; }
.team li { display: grid; }
.team b { font-family: var(--display); font-weight: 600; font-size: 1.02rem; }
.team span { font-size: var(--s-sm); color: var(--muted); }
.needs { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
.needs li { padding: 12px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 2.2em minmax(0, 1fr); }
.needs li::before { content: "+"; font-family: var(--display); font-weight: 700; color: var(--sage-soft); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.note { color: var(--muted); font-size: var(--s-sm); }
.updates { list-style: none; padding: 0; margin: 0; }
.updates li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 16px; }
.updates time { font-family: var(--display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--sage-soft); padding-top: 3px; }
.empty { border: 1px dashed var(--line); border-radius: 4px; padding: 18px; color: var(--muted); font-size: var(--s-sm); }
/* Laurels and news */
.laurels { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 0 0 26px; padding: 0; list-style: none; }
.laurel { display: grid; grid-template-columns: 22px auto 22px; align-items: center; gap: 4px; color: var(--sage-soft); }
.laurel svg { width: 22px; height: 52px; display: block; }
.laurel svg.r { transform: scaleX(-1); }
.laurel div { display: grid; justify-items: center; text-align: center; line-height: 1.1; max-width: 13.5em; }
.laurel small { font-family: var(--display); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sage-soft); }
.laurel b { font-family: var(--display); font-weight: 700; font-size: 0.86rem; color: var(--cream); margin-top: 3px; text-wrap: balance; }
.laurel span { font-family: var(--display); font-size: 0.7rem; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.latest { background: var(--forest-deep); border-radius: 6px; padding: 16px 20px; margin: 0 0 26px; display: grid; gap: 6px; max-width: 46em; }
.latest .w-label { display: flex; gap: 10px; align-items: baseline; padding: 0; }
.latest .w-label time { color: var(--muted); letter-spacing: 0.08em; }
.latest p { margin: 0; }
.src { font-family: var(--display); font-size: var(--s-xs); color: var(--sage-soft); text-decoration: none; white-space: nowrap; }
.src:hover { color: var(--cream); text-decoration: underline; }
.updates li > div { display: grid; gap: 4px; }
.card .accolade { display: flex; gap: 6px; align-items: center; font-family: var(--display); font-size: var(--s-xs); color: var(--sage-soft); line-height: 1.25; }
.card .accolade svg { width: 10px; height: 22px; flex: none; }
.card .accolade b { color: var(--cream); font-weight: 600; }
.tabs .count { display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; margin-left: 6px; border-radius: 999px; background: var(--sage); color: var(--ink); font-size: 0.72em; font-variant-numeric: tabular-nums; }
.panel h4 {
  font-family: var(--display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--sage-soft); margin: 32px 0 12px;
}
.panel h4:first-child { margin-top: 0; }

footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: var(--s-sm); }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 960px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .project { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .project aside { position: static; }
  .w-intro, .w-row, .why-top, .select { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .cover-foot { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps li:nth-child(3) { padding-left: 0; border-left: 0; }
  .steps li:nth-child(n+3) { border-top: 1px solid var(--line); }
}
@media (max-width: 560px) {
  .grid { gap: 28px 14px; }
  .card h3 { font-size: 1.08rem; }
  .card p { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .stills { grid-template-columns: minmax(0, 1fr); }
  .wordmark span { display: none; }
  .counter { display: none; }
  .updates li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .cover-actions .btn { flex: 1 1 auto; justify-content: center; padding: 14px 20px; }
  .w-next .btn { flex: 1 1 auto; justify-content: center; padding: 16px 22px; }
  .mosaic { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
  .select, .panel-dark { padding: 22px; }
  .criteria { grid-template-columns: minmax(0, 1fr); }
  .steps { grid-template-columns: minmax(0, 1fr); }
  .steps li, .steps li + li { padding: 16px 0 4px; border-left: 0; }
  .steps li + li { border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { .poster { transition: none; } }
</style>

</head>
<body>
<header class="bar gutter">
  <div class="bar-inner">
    <a class="wordmark" href="#cover">nonfiction hotlist.<span>2026</span></a>
    <nav class="bar-nav" aria-label="Deck">
      <a class="btn icon-btn" id="prevBtn" href="#" aria-label="Previous">&larr;</a>
      <span class="counter" id="counter"></span>
      <a class="btn icon-btn" id="nextBtn" href="#" aria-label="Next">&rarr;</a>
      <button class="btn" id="indexBtn" type="button" aria-expanded="false">Index</button>
      <button class="btn solid" id="pdfBtn" type="button" hidden>Download PDF</button>
    </nav>
  </div>
</header>

<div class="index-panel" id="indexPanel" hidden>
  <div class="index-sheet" role="dialog" aria-label="Project index">
    <div class="index-head"><h2>index</h2><button class="btn icon-btn" id="indexClose" type="button" aria-label="Close index">&times;</button></div>
    <ol id="indexList"></ol>
  </div>
</div>

<main id="app" class="gutter"></main>

<footer class="gutter">
  <div class="wrap">
    <span>nonfiction hotlist. &middot; <span id="footEmail"></span></span>
    <span id="footNote"></span>
  </div>
</footer>

<script>
/* ============================================================
   SITE DATA. Generated by scripts/content/write-page.js from
   years/2026/content/content.json (text, mirrored from the Google Drive kit) and
   years/2026/content/layout.json (images and framing). Do not edit by hand.
   Text uses **double asterisks** for the marker highlight.
   ============================================================ */
const SITE = {
  "year": "2026",
  "PER_PAGE": 4,
  "intro": "20 ambitious nonfiction projects with extraordinary creative potential, each looking for the support to move forward.",
  "footer": {
    "email": "info@nonfictionhotlist.com",
    "note": "Projects listed in alphabetical order"
  },
  "welcome": {
    "heading": "welcome to the nonfiction hotlist",
    "lede": [
      "We believe creators and storytellers are the lifeblood of our industry and deserve more pathways to bring their visions to life.",
      "This curated collection represents **20 ambitious projects** that have demonstrated extraordinary creative potential but need support to move forward."
    ],
    "invitation": [
      "While funding and distribution remain universal needs for all these projects, we believe there are many ways to help reduce costs and build momentum.",
      "Look through these projects with an eye for how you might contribute. Each page identifies specific needs, from production support to technical expertise to strategic connections."
    ],
    "whyHeading": "why this matters",
    "why": [
      "The marketplace needs ambitious, unusual, and visionary nonfiction projects. When we collaborate as a community, we create new possibilities and counter the risk-aversion of traditional gatekeepers. Every contribution, whether financial investment or in-kind support, generates meaningful momentum, giving creators more leverage.",
      "Supporting these projects strengthens not only their individual journeys but the broader health and vibrancy of our entire nonfiction ecosystem. The hundreds of other remarkable submissions we received confirm the wealth of untapped storytelling potential waiting for champions."
    ],
    "criteria": [
      "Originality",
      "Feasibility",
      "Compelling subjects",
      "Evocative storytelling"
    ],
    "selection": "Some creators are first-time filmmakers; others are established voices who still face challenges securing support for ambitious work. What unites them is the exceptional quality of their vision.",
    "how": [
      [
        "Reach out",
        "Contact projects directly whose vision inspires you."
      ],
      [
        "Give",
        "Support their 501(c)(3) fiscal sponsorships where available."
      ],
      [
        "Follow",
        "Follow their creative journeys across social platforms."
      ],
      [
        "Contribute",
        "Review each project's How to help section and offer the specific resources they need."
      ]
    ],
    "close": "This document is **meant to be used**. These projects are **meant to be made**. The future of exceptional nonfiction storytelling depends on our collective action."
  }
};

const PROJECTS = [

];

/* ============================================================
   Rendering. You shouldn't need to edit below this line.
   ============================================================ */
const app = document.getElementById("app");
document.getElementById("footEmail").textContent = SITE.footer.email;
document.getElementById("footNote").textContent = SITE.footer.note;
const PAGES = Math.ceil(PROJECTS.length / SITE.PER_PAGE);
const SEQ = ["cover", "welcome", "why"].concat(Array.from({ length: PAGES }, (_, i) => "page-" + (i + 1)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const pageOf = idx => Math.floor(idx / SITE.PER_PAGE) + 1;

function poster(p, idx, big) {
  const src = big ? p.hero : p.key;
  if (src) return `<div class="poster has-img${big ? " big" : ""}"><img src="${esc(src)}" alt="${esc(p.title)}"${big ? ` style="object-position:${p.focus ?? 50}% ${p.focusY ?? 50}%"` : ' loading="lazy"'}></div>`;
  return `<div class="poster t${idx % 3}${big ? " big" : ""}" role="img" aria-label="${esc(p.title)}">
    <span class="p-foot"><span>NFH ${SITE.year}</span><span>${pad(idx + 1)}</span></span>
    <span class="p-title">${esc(p.title)}</span>
  </div>`;
}

function renderCover() {
  return `<section class="cover wrap">
    <div class="cover-head">
      <div class="cover-year">${SITE.year}</div>
      <h1>nonfiction<br>hotlist.</h1>
    </div>
    <div class="cover-foot">
      <p class="lede">${esc(SITE.intro)}</p>
      <div class="cover-actions">
        <a class="btn solid" href="#welcome">Begin</a>
        <a class="btn" href="#page-1">Go to the projects</a>
        <button class="btn" type="button" data-pdf hidden>Download PDF</button>
      </div>
    </div>
    <div class="cover-strip">${PROJECTS.map(p => `<a href="#${p.slug}">${esc(p.title)}</a>`).join("")}</div>
  </section>`;
}

/* **double asterisks** in the text become the marker highlight; a leading number inside one gets the display face. */
function hiText(text) {
  return esc(text).replace(/\*\*(.+?)\*\*/g, (_, inner) =>
    `<span class="hi">${inner.replace(/^(\d[\d,]*)(\s)/, '<span class="num">$1</span>$2')}</span>`);
}

function renderWelcome() {
  const W = SITE.welcome;
  const mosaic = PROJECTS.filter(p => p.key).slice(0, 18).map(p =>
    `<a href="#${p.slug}" title="${esc(p.title)}"><img src="${esc(p.key)}" alt="${esc(p.title)}" decoding="async"></a>`).join("");
  const lede = W.lede.map(t => `<p>${hiText(t)}</p>`).join("");
  return `<section class="wrap">
    <div class="mosaic" aria-label="Project images">${mosaic}</div>
    <div class="w-intro">
      <h2>${esc(W.heading)}</h2>
      <div class="w-lede">${lede}</div>
    </div>
    <div class="w-row panel-dark">
      <div class="w-label">our invitation</div>
      <div>${W.invitation.map(t => `<p>${hiText(t)}</p>`).join("")}</div>
    </div>
    <div class="w-next"><a class="btn solid" href="#why">Why this matters &rarr;</a></div>
  </section>`;
}

/* Staggered reveal for the welcome mosaic. Fixed, scattered order so some tiles land early. */
const MOSAIC_BEATS = [0, 420, 140, 700, 260, 980, 560, 60, 840, 330, 1120, 200, 900, 480, 640, 1040, 280, 760];
function revealMosaic() {
  const start = performance.now();
  document.querySelectorAll(".mosaic img").forEach((img, i) => {
    const beat = MOSAIC_BEATS[i % MOSAIC_BEATS.length];
    const tile = img.parentElement;
    if (i % 3 === 1) tile.classList.add("v");
    const show = () => setTimeout(() => tile.classList.add("in"), Math.max(0, beat - (performance.now() - start)));
    if (img.complete && img.naturalWidth) show();
    else { img.addEventListener("load", show, { once: true }); img.addEventListener("error", () => tile.classList.add("in"), { once: true }); }
  });
}

function renderWhy() {
  const W = SITE.welcome;
  return `<section class="wrap">
    <div class="why-top">
      <h2>${esc(W.whyHeading)}</h2>
      <div>${W.why.map(t => `<p>${hiText(t)}</p>`).join("")}</div>
    </div>
    <div class="select">
      <div class="big">${PROJECTS.length}<small>projects selected<br>from hundreds of submissions</small></div>
      <div>
        <div class="w-label" style="margin-bottom:12px">selected on their merits</div>
        <ul class="criteria">${W.criteria.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
        <p>${esc(W.selection)}</p>
      </div>
    </div>
    <div class="w-label" style="margin-top:40px">how to use this list</div>
    <ol class="steps">${W.how.map(([h, t], i) => `<li><span class="k">${i + 1}</span><b>${esc(h)}</b><span>${esc(t)}</span></li>`).join("")}</ol>
    <p class="close-line">${hiText(W.close)}</p>
    <div class="w-next"><a class="btn solid" href="#page-1">See the projects &rarr;</a></div>
  </section>`;
}

function dots(current) {
  return `<nav class="dots" aria-label="Project pages">${Array.from({ length: PAGES }, (_, i) =>
    `<a href="#page-${i + 1}"${i + 1 === current ? ' aria-current="page"' : ""}>${i + 1}</a>`).join("")}</nav>`;
}

/* A laurel branch: paired leaves along a curved stem. Mirrored for the right side. */
const BRANCH = (() => {
  const out = [];
  const leaf = (x, y, rot, rx = 2.4, ry = 5.6) => out.push(`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx}" ry="${ry}" transform="rotate(${rot.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`);
  const N = 6;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    const x = 14 - Math.sin(t * Math.PI * 0.85) * 7, y = 55 - t * 46;
    const tilt = (t - 0.5) * 30;
    leaf(x - 3.6, y - 2.5, -38 + tilt);
    leaf(x + 2.6, y - 3.2, 28 + tilt, 2.1, 5);
  }
  leaf(12.6, 5.5, 8, 2.2, 5);
  const stem = `<path d="M15 58 C 8 46, 6 26, 12.5 6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>`;
  return stem + `<g fill="currentColor">${out.join("")}</g>`;
})();
const branch = (cls = "") => `<svg class="${cls}" viewBox="0 0 22 60" aria-hidden="true">${BRANCH}</svg>`;
const laurelText = l => `${l.note ? l.note + ", " : ""}${l.event}${l.year ? " " + l.year : ""}`;
function laurelsHTML(list) {
  if (!list || !list.length) return "";
  return `<ul class="laurels" aria-label="Festivals and awards">${list.map(l => `<li class="laurel" title="${esc(laurelText(l))}">${branch()}<div>${l.note ? `<small>${esc(l.note)}</small>` : ""}<b>${esc(l.event)}</b>${l.year ? `<span>${l.year}</span>` : ""}</div>${branch("r")}</li>`).join("")}</ul>`;
}
const srcLink = u => u.url ? ` <a class="src" href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.source || "Source")} &nearr;</a>` : "";

function renderGrid(n) {
  const start = (n - 1) * SITE.PER_PAGE;
  const items = PROJECTS.slice(start, start + SITE.PER_PAGE);
  const cards = items.map((p, i) => `<a class="card" href="#${p.slug}">
      ${poster(p, start + i)}
      <span class="meta">${esc(p.format)}</span>
      <h3>${esc(p.title)}</h3>
      <p>${esc(p.logline)}</p>
      ${(p.laurels || []).length ? `<span class="accolade">${branch()}<span><b>${esc(p.laurels[0].note || "Official Selection")}</b>, ${esc(p.laurels[0].event)}${p.laurels[0].year ? " " + p.laurels[0].year : ""}${p.laurels.length > 1 ? ` <span>+${p.laurels.length - 1} more</span>` : ""}</span></span>` : ""}
    </a>`).join("");
  const prev = n > 1 ? `#page-${n - 1}` : "#why";
  const next = n < PAGES ? `#page-${n + 1}` : null;
  return `<section class="wrap">
    <div class="page-head">
      <div><h2>projects</h2><span class="range">${pad(start + 1)}&ndash;${pad(start + items.length)} of ${PROJECTS.length}</span></div>
      ${dots(n)}
    </div>
    <div class="grid">${cards}</div>
    <div class="pager">
      <a class="btn" href="${prev}">&larr; ${n > 1 ? "Previous page" : "Why this matters"}</a>
      ${next ? `<a class="btn solid" href="${next}">Next page &rarr;</a>` : `<a class="btn" href="#cover">Back to cover</a>`}
    </div>
  </section>`;
}

function paras(text) { return text.split(/\n\n+/).map(t => `<p>${esc(t)}</p>`).join(""); }

function renderProject(idx, tab) {
  const p = PROJECTS[idx];
  const ups = p.updates || [];
  const tabs = [["", "Overview"], ["help", "How to help"], ["links", "Links & updates"]];
  const tabNav = tabs.map(([k, label]) =>
    `<a href="#${p.slug}${k ? "." + k : ""}" aria-current="${tab === k}">${label}${k === "links" && ups.length ? `<span class="count" aria-label="${ups.length} updates">${ups.length}</span>` : ""}</a>`).join("");
  let panel = "";
  if (tab === "help") {
    panel = `<h4>What this project needs</h4><ul class="needs">${p.help.map(h => `<li>${esc(h)}</li>`).join("")}</ul>
      <h4>Get in touch</h4><p>Reach the team directly at <code style="user-select:all">${esc(p.contact)}</code>.</p>`;
  } else if (tab === "links") {
    const links = p.links.length
      ? `<div class="links">${p.links.map(([l, u]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${esc(l)} &nearr;</a>`).join("")}</div>`
      : `<p class="note">No public links yet.</p>`;
    const updates = p.updates.length
      ? `<ul class="updates">${p.updates.map(u => `<li><time>${esc(u.date)}</time><div><span>${esc(u.text)}</span>${srcLink(u)}</div></li>`).join("")}</ul>`
      : `<div class="empty">No updates yet. Screenings, press, funding news, and festival selections will appear here as they happen.</div>`;
    panel = `<h4>Links</h4>${links}${p.onRequest ? `<p class="note">${esc(p.onRequest)}.</p>` : ""}<h4>Updates</h4>${updates}`;
  } else {
    const st = p.stills || [];
    const gallery = st.length > 1
      ? `<h4>Stills</h4><div class="stills${st.length === 3 ? " three" : ""}">${st.slice(1).concat(st.slice(0, 1)).slice(0, 3).map(([src], i) =>
          `<button type="button" data-full="${esc(src)}" aria-label="Enlarge still ${i + 1}"><img src="${esc(src)}" alt="Still from ${esc(p.title)}" loading="lazy"></button>`).join("")}</div>`
      : "";
    panel = `<div class="prose">${paras(p.summary)}</div>${gallery}
      <h4>Creative team</h4><ul class="team">${p.team.map(([n, r]) => `<li><b>${esc(n)}</b><span>${esc(r)}</span></li>`).join("")}</ul>`;
  }
  const prev = idx > 0 ? PROJECTS[idx - 1] : null;
  const next = idx < PROJECTS.length - 1 ? PROJECTS[idx + 1] : null;
  const pg = pageOf(idx);
  return `<div class="wrap">
    <div class="crumb"><a href="#page-${pg}">&larr; Projects, page ${pg}</a></div>
    <figure class="hero">${poster(p, idx, true)}</figure>
    <article class="project">
      <div style="min-width:0">
        <h1>${esc(p.title)}</h1>
        <p class="logline">${esc(p.logline)}</p>
        ${laurelsHTML(p.laurels)}
        ${ups.length && tab !== "links" ? `<div class="latest"><div class="w-label">Latest <time>${esc(ups[0].date)}</time></div><p>${esc(ups[0].text)}${srcLink(ups[0])}</p></div>` : ""}
        <nav class="tabs" aria-label="Project sections">${tabNav}</nav>
        <div class="panel">${panel}</div>
      </div>
      <aside>
        <dl class="facts">
          <div><dt>Format</dt><dd>${esc(p.format)}</dd></div>
          <div><dt>Status</dt><dd>${esc(p.status)}</dd></div>
          <div><dt>Contact</dt><dd class="copy-row"><code>${esc(p.contact)}</code><button class="btn copy-btn" type="button" data-copy="${esc(p.contact)}">Copy</button></dd></div>
        </dl>
      </aside>
    </article>
    <div class="pager">
      ${prev ? `<a class="btn" href="#${prev.slug}">&larr; ${esc(prev.title)}</a>` : `<span></span>`}
      ${next ? `<a class="btn" href="#${next.slug}">${esc(next.title)} &rarr;</a>` : `<a class="btn" href="#page-${PAGES}">Back to projects</a>`}
    </div>
  </div>`;
}

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const counter = document.getElementById("counter");

function setNav(prev, next, label) {
  [[prevBtn, prev], [nextBtn, next]].forEach(([b, h]) => {
    if (h) { b.href = h; b.removeAttribute("aria-disabled"); } else { b.href = "#"; b.setAttribute("aria-disabled", "true"); }
  });
  counter.textContent = label;
}

/* Visit counting. The website defines window.nfhTrack (GoatCounter); in the Claude version it doesn't
   exist and nothing is counted. A project counts once per visit, not per tab. */
let lastCounted = null;
function countView(path, title) {
  if (path === lastCounted) return;
  lastCounted = path;
  if (window.nfhTrack) window.nfhTrack(path, title);
}

function route() {
  const raw = (location.hash || "#cover").slice(1);
  const [key, tab = ""] = raw.split(".");
  const projIdx = PROJECTS.findIndex(p => p.slug === key);
  if (projIdx > -1) {
    app.innerHTML = renderProject(projIdx, ["help", "links"].includes(tab) ? tab : "");
    setNav(projIdx > 0 ? "#" + PROJECTS[projIdx - 1].slug : null,
           projIdx < PROJECTS.length - 1 ? "#" + PROJECTS[projIdx + 1].slug : null,
           `${pad(projIdx + 1)} / ${PROJECTS.length}`);
    document.title = `${PROJECTS[projIdx].title} · The ${SITE.year} Nonfiction Hotlist`;
    countView("/" + key, PROJECTS[projIdx].title);
  } else {
    let pos = SEQ.indexOf(key);
    if (pos < 0) pos = 0;
    const k = SEQ[pos];
    app.innerHTML = k === "cover" ? renderCover() : k === "welcome" ? renderWelcome() : k === "why" ? renderWhy() : renderGrid(+k.split("-")[1]);
    if (k === "welcome") revealMosaic();
    setNav(pos > 0 ? "#" + SEQ[pos - 1] : null, pos < SEQ.length - 1 ? "#" + SEQ[pos + 1] : null,
           k.startsWith("page-") ? `Page ${k.split("-")[1]} / ${PAGES}` : ({ cover: "Cover", welcome: "Welcome", why: "About" })[k]);
    document.title = `The ${SITE.year} Nonfiction Hotlist`;
    countView(k === "cover" ? "/" : "/" + k, ({ cover: "Cover", welcome: "Welcome", why: "About" })[k] || `Index page ${k.split("-")[1]}`);
  }
  if (!tab) window.scrollTo(0, 0);
}

/* Index drawer */
const panelEl = document.getElementById("indexPanel");
const indexBtn = document.getElementById("indexBtn");
document.getElementById("indexList").innerHTML =
  PROJECTS.map((p, i) => `<li><a href="#${p.slug}"><span class="n">${pad(i + 1)}</span>${esc(p.title)}</a></li>`).join("");
function toggleIndex(open) {
  panelEl.hidden = !open; indexBtn.setAttribute("aria-expanded", String(open));
  if (open) document.getElementById("indexClose").focus();
}
indexBtn.addEventListener("click", () => toggleIndex(panelEl.hidden));
document.getElementById("indexClose").addEventListener("click", () => toggleIndex(false));
panelEl.addEventListener("click", e => { if (e.target === panelEl || e.target.closest("a")) toggleIndex(false); });

/* Copy contact */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const text = b.dataset.copy;
  const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1600); };
  const fallback = () => {
    const code = b.parentElement.querySelector("code");
    const r = document.createRange(); r.selectNodeContents(code);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    b.textContent = "Selected";
  };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch (_) { fallback(); }
});

/* Stills lightbox */
const lb = document.createElement("div");
lb.className = "lightbox"; lb.hidden = true;
lb.innerHTML = `<img alt=""><button class="btn icon-btn" type="button" aria-label="Close">&times;</button>`;
document.body.appendChild(lb);
lb.addEventListener("click", () => { lb.hidden = true; });
app.addEventListener("click", e => {
  const b = e.target.closest("[data-full]");
  if (!b) return;
  lb.querySelector("img").src = b.dataset.full;
  lb.querySelector("img").alt = b.querySelector("img").alt;
  lb.hidden = false;
});

/* Arrow keys page through the deck */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !lb.hidden) { lb.hidden = true; return; }
  if (e.key === "Escape" && !panelEl.hidden) return toggleIndex(false);
  if (e.target.closest("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight" && !nextBtn.hasAttribute("aria-disabled")) location.hash = nextBtn.getAttribute("href");
  if (e.key === "ArrowLeft" && !prevBtn.hasAttribute("aria-disabled")) location.hash = prevBtn.getAttribute("href");
});

/* Download PDF: the PDF is built from this same data and published alongside the page. */
const PDF_FILE = "hotlist-" + SITE.year + ".pdf";
let downloads = null, pdfBusy = false;
const toastEl = document.createElement("div");
toastEl.className = "toast"; toastEl.hidden = true; toastEl.setAttribute("role", "status");
document.body.appendChild(toastEl);
function toast(msg) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 3200);
}
/* On the public website there is no Claude viewer, so a plain file link does the download. */
const STANDALONE = !(window.claude && window.claude.use);
function showPdfButtons() {
  const on = STANDALONE || !!downloads;
  document.getElementById("pdfBtn").hidden = !on;
  document.querySelectorAll("[data-pdf]").forEach(b => { b.hidden = !on; });
}
function linkDownload() {
  const a = document.createElement("a");
  a.href = PDF_FILE; a.download = `Nonfiction Hotlist ${SITE.year}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
}
async function downloadPdf() {
  if (STANDALONE) return linkDownload();
  if (!downloads || pdfBusy) return;
  pdfBusy = true;
  try {
    const res = await fetch(PDF_FILE);
    if (!res.ok) throw { code: "missing" };
    const blob = await res.blob();
    await downloads.save({ filename: `Nonfiction Hotlist ${SITE.year}.pdf`, data: blob });
  } catch (e) {
    const code = e && e.code;
    if (code === "declined") {}
    else if (code === "rate_limited") toast("A download is already waiting for your OK.");
    else if (code === "missing") toast("The PDF isn't available right now. Try again in a moment.");
    else if (["unavailable", "not_granted", "capability_disabled", "capability_removed", "extension_not_enabled"].includes(code)) {
      toast("Downloads aren't available in this view."); downloads = null; showPdfButtons();
    } else toast("The PDF didn't download. Try again.");
  } finally { pdfBusy = false; }
}
document.addEventListener("click", e => {
  if (!e.target.closest("#pdfBtn, [data-pdf]")) return;
  if (window.nfhTrack) window.nfhTrack("pdf-download", "PDF download", true);
  downloadPdf();
});
showPdfButtons();
(async () => {
  if (STANDALONE) return;
  try { downloads = await window.claude.use("downloads"); } catch (_) { downloads = null; }
  showPdfButtons();
})();

window.addEventListener("hashchange", () => { route(); showPdfButtons(); });
route();
showPdfButtons();
</script>
</body>
